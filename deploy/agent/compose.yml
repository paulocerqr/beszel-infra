services:
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    dns:
      - 100.100.100.100
    volumes:
      - ./beszel_agent_data:/var/lib/beszel-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      HUB_URL: "${BESZEL_URL:?Defina BESZEL_URL no .env}"
      KEY: "${BESZEL_KEY:?Defina BESZEL_KEY no .env}"
      TOKEN: "${BESZEL_TOKEN:?Defina BESZEL_TOKEN no .env}"
      DISABLE_SSH: "true"
